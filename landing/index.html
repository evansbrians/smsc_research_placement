<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMSC research placement</title>
<link rel="icon" href="r_learning/src/images/hex_icon.png">
<style>
  :root { --ink: #212529; --muted: #6c757d; --line: #dee2e6; --accent: #2780e3; --bg: #ffffff; --card: #f8f9fa; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e9ecef; --muted: #adb5bd; --line: #3a3f44; --accent: #6ea8fe; --bg: #1b1e21; --card: #24282c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; line-height: 1.5; }
  main { max-width: 860px; margin: 0 auto; padding: 56px 16px; }
  header { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }
  header img { width: 88px; height: auto; }
  h1 { margin: 0; font-size: 2rem; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .books { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  a.book { display: block; padding: 24px; border: 1px solid var(--line); border-radius: 8px;
           background: var(--card); color: inherit; text-decoration: none; }
  a.book:hover, a.book:focus-visible { border-color: var(--accent); }
  a.book h2 { margin: 0 0 8px; font-size: 1.3rem; color: var(--accent); }
  a.book p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <img src="r_learning/src/images/hex_complex.png" alt="">
    <div>
      <h1>SMSC research placement</h1>
      <p>Brian S. Evans and Tara N. Snedgen</p>
    </div>
  </header>
  <div class="books">
    <a class="book" href="r_learning/">
      <h2>R learning materials</h2>
      <p>A self-paced introduction to R, RStudio, and the tidyverse, with the data and scripts used in each lesson.</p>
    </a>
    <a class="book" href="research_skills/">
      <h2>Research skills</h2>
      <p>Developing a research proposal, giving scientific presentations, and writing an abstract.</p>
    </a>
  </div>
</main>
</body>
</html>
