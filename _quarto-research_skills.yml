project:
  output-dir: _book/research_skills
  render:
    - index.qmd
    - /research_skills/*.qmd
    - presentations/*.qmd
    - abstracts/*.qmd
  resources:
    - /src/images/**
    - /src/js/*
    - /src/lib/**
    - /research_skills/images/*

book:
