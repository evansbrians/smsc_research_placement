project:
  type: book
  execute-dir: project

profile:
  default: r_learning

book:
  author: "Brian S. Evans and Tara N. Snedgen"
  subtitle: "SMSC research placement"
  favicon: src/images/hex_icon.png
  search: true

engine: knitr

execute:
  freeze: auto
  echo: true
  eval: true
  error: true
  warning: false
  message: false

format:
  live-html:
    toc: true
    toc-depth: 4
    number-sections: false
    css: src/includes/webex.css
    include-in-header: src/includes/header_includes.html
    include-after-body:
      - src/includes/accordion_script.html
      - src/includes/webex.js
      - src/includes/parsons_includes.html
      - src/includes/figure_modal.html
      - src/includes/answer_modal.html
      - src/includes/glossary_popups.html
    theme:
      - cosmo
      - src/css/custom_style.scss
    webr:
      packages: [tidyverse]

editor: source
editor_options:
  chunk_output_type: console
